<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="1; url=/maths">
    <script>
        // Fallback JavaScript redirect with a 1-second delay
        setTimeout(() => {
            window.location.href = "/maths";
        }, 1000);
    </script>
</head>
<body>
    <p>Redirecting you to <a href="/maths">the best maths homework</a> in 1 second...</p>
</body>
</html>
